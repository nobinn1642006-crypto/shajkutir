<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Emblem: Lotus Petal + Diya Flame -->
  <g transform="translate(10, 12)">
    <!-- Base Lotus leaf -->
    <path d="M28 48 C16 48 6 36 6 24 C14 26 22 36 28 48 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <path d="M28 48 C40 48 50 36 50 24 C42 26 34 36 28 48 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Central flame -->
    <path d="M28 48 C20 38 18 22 28 6 C38 22 36 38 28 48 Z" fill="url(#goldGrad)" filter="url(#subtleGlow)"/>
    <!-- Diya Bowl -->
    <path d="M12 44 C20 54 36 54 44 44 Z" fill="#88132B"/>
    <circle cx="28" cy="20" r="3" fill="#FFF8E7"/>
  </g>
  
  <!-- Typography -->
  <text x="75" y="44" font-family="'Playfair Display', 'Noto Serif Bengali', serif" font-size="30" font-weight="700" fill="url(#goldGrad)" letter-spacing="1.5">ShajKutir</text>
  <text x="77" y="60" font-family="'Inter', 'Noto Sans Bengali', sans-serif" font-size="10.5" font-weight="500" fill="#E8D8C8" letter-spacing="3.2" text-transform="uppercase">Puja Collection 2026</text>
</svg>